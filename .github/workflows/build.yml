name: Build NVCloud Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install psutil==5.9.8
          pip install requests==2.28.2
          pip install charset-normalizer==2.1.1
          pip install chardet==5.2.0
          pip install cryptography==41.0.0
          pip install pywin32==306
          pip install pystray==0.19.5
          pip install Pillow==10.2.0
          pip install winotify==1.1.0
          pip install pyinstaller==6.3.0
      - name: Compilar Windows
        run: |
          pyinstaller --onefile --noconsole --name NVCloudAgent `
            --collect-all charset_normalizer `
            --collect-all requests `
            --collect-all pystray `
            --collect-all PIL `
            --hidden-import=winotify `
            --hidden-import=chardet `
            --hidden-import=charset_normalizer `
            --hidden-import=win32api `
            --hidden-import=win32con `
            --hidden-import=win32ts `
            --hidden-import=win32security `
            --hidden-import=win32process `
            --hidden-import=win32service `
            --hidden-import=win32serviceutil `
            --hidden-import=win32event `
            --hidden-import=servicemanager `
            --hidden-import=pywintypes `
            --hidden-import=pystray `
            --hidden-import=PIL `
            --hidden-import=tkinter `
            agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NVCloudAgent.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install psutil==5.9.8
          pip install requests==2.28.2
          pip install charset-normalizer==2.1.1
          pip install chardet==5.2.0
          pip install cryptography==41.0.0
          pip install pyinstaller==6.3.0
      - name: Compilar Linux
        run: |
          pyinstaller --onefile --name nvcloud-agent \
            --collect-all charset_normalizer \
            --collect-all requests \
            --hidden-import=chardet \
            --hidden-import=charset_normalizer \
            agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/nvcloud-agent

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-exe/NVCloudAgent.exe
            linux-bin/nvcloud-agent
